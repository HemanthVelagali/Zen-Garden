<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Zen Garden</title>
        <link rel="icon" href="Images/Icons/dog_favicon.png">
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div class="header">
            <img src="Images/Icons/dog_minecraft.png" class="header-icon">
            <h3 class="title">Zen Garden</h3>
            <div class="footer">
            <button id="settingBtn">Setting</button>
        </div>
        </div>
       <div class="container">
        <div class="timer-box">
           <div class="mode-switch">
            <button id="pomodoroModeBtn" class="mode-btn active">Pomodoro</button>
            <button id="pomodorPlusModeBtn" class="mode-btn">Pomodoro+</button>
            <button id="stopwatchModeBtn" class="mode-btn">Stopwatch</button>
           </div> 
        <div id="timeDisplay"></div>
        <div class="button-group">
        <button id="startBtn">Start</button>
        <button id="stopBtn">Stop</button>
        <button id="resetBtn">Reset</button>
        </div>
        </div>
       </div>
        <div class="settings-panel" id="settingsPanel">
            <label>
                Hrs:
                <input type="number" id="hoursInput" min="0" max="23" value="0">
            </label>
            <label>
                Min:
                <input type="number" id="minutesInput" min="0" max="59" value="25">
            </label>
            <label>
                Sec:
                <input type="number" id="secondsInput" min="0" max="59" value="0">
            </label>
            <div class="wallpaper-options">
            <img src="Images/fogy_forest.jpg" data-image="Images/fogy_forest.jpg" class="wallpaper-thumb">
            <img src="Images/Itachi.jpg" data-image="Images/Itachi.jpg" class="wallpaper-thumb">
            <img src="Images/red_car.jpg" data-image="Images/red_car.jpg" class="wallpaper-thumb">
            <img src="Images/Man_with_panda.png" data-image="Images/Man_with_panda.png" class="wallpaper-thumb">
            <img src="Images/po.jpg" data-image="Images/po.jpg" class="wallpaper-thumb">
            <img src="Images/anime_girl.jpg" data-image="Images/anime_girl.jpg" class="wallpaper-thumb">
            </div>
            <div class="sounds">
               <!-- Click Sound Selection -->
                <label for="clickSoundSelect">Start Sound:</label>
                <select id="clickSoundSelect">
                    <option value="Sounds/clock-ticking.mp3">Clock-ticking</option>
                    <option value="Sounds/bam-dragon-ball.mp3">Goku-bam</option>
                </select>
                <button id="previewClick">🔊 Preview</button>

                <!-- End Sound Selection -->
                <br><br>
                <label for="endSoundSelect">End Sound:</label>
                <select id="endSoundSelect">
                    <option value="Sounds/end-timer.mp3">Kitchen clock</option>
                    <option value="Sounds/air-siren.mp3">Air siren</option>
                    <option value="Sounds/kids-saying-yay.mp3">Kids yay</option>
                </select>
                <button id="previewEnd">🔊 Preview</button>
            </div>


            <button id="applySettingsBtn">Apply</button>
            

        </div>

       <script src="script.js"></script>
    </body>
</html>
